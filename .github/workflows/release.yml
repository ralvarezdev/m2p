name: Release

# Manual-dispatch only, deliberately: push/PR/tag triggers are off so nothing
# runs on a billed GitHub-hosted runner. The same workflow runs locally instead
# (`task ci:local`), and workflow_dispatch stays so it can still be run by hand
# from the Actions tab when needed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
